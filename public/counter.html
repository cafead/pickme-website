<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Counter | Pick Me Cafe</title>
<link rel="icon" href="/img/logo.png">
<style>
  :root { --ink: #2B2118; --soft: #5F5243; --line: #D8CDBD; --bg: #F4F0EA; --card: #fff; --main: #7A5A22; --new: #B3371F; --go: #1D5FA8; --ok: #24693F; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  h1, h2, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  a { color: #5E4417; }
  button, input, select { font: inherit; color: inherit; }
  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: #fff; cursor: pointer; text-decoration: none; font-weight: 500; white-space: nowrap; }
  button:hover, .btn:hover { background: #F3EADB; }
  .main { background: var(--main); border-color: var(--main); color: #fff; }
  .main:hover { background: #654A1A; }
  input, select { min-height: 42px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
  input[type=checkbox] { min-height: 0; width: 20px; height: 20px; accent-color: var(--main); }
  :focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }

  .bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--ink); color: #fff; }
  .bar h1 { font-size: 1.05rem; font-weight: 600; }
  .bar small { opacity: .8; }
  .bar .right { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .bar button, .bar .btn { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: #fff; }
  .bar button:hover, .bar .btn:hover { background: rgba(255, 255, 255, .24); }
  .wrap { width: min(1400px, 100% - 28px); margin: 16px auto 60px; }
  .tools { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .count { min-width: 22px; padding: 0 6px; border-radius: 11px; background: var(--new); color: #fff; font-size: .78rem; line-height: 22px; text-align: center; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; align-items: start; }
  .card { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 12px; background: var(--card); }
  .card.pending { border-left-color: var(--new); }
  .card.acknowledged, .card.preparing, .card.confirmed, .card.seated { border-left-color: var(--go); }
  .card.done, .card.cancelled, .card.declined { opacity: .75; }
  .step { padding: 1px 9px; border-radius: 999px; background: #EEE; font-size: .8rem; font-weight: 600; }
  .step--pending { background: #FBE3DE; color: #8E2A1E; }
  .step--acknowledged, .step--preparing, .step--confirmed, .step--seated { background: #DFEAF7; color: #174A84; }
  .step--ready { background: #F6EBC8; color: #6A520F; }
  .step--done { background: #DDEFE3; color: #1B5532; }
  .today { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .today b { font-variant-numeric: tabular-nums; }
  .card.ready { border-left-color: var(--ok); }
  .card header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .card header strong { font: 700 1rem ui-monospace, Menlo, Consolas, monospace; }
  .card header small { color: var(--soft); }
  .card header b { margin-left: auto; font-size: 1.05rem; }
  .tag { padding: 1px 10px; border-radius: 999px; background: #F3EADB; font-size: .82rem; }
  .paycheck { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #FFF3D6; border: 1px solid #E6C77A; }
  .paycheck p { font-weight: 600; color: #6A4A0C; }
  .paycheck div { display: flex; flex-wrap: wrap; gap: 8px; }
  .card.to-check { border-left-color: #D49A17; }
  .alert { display: none; margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; background: #FFF3D6; border: 1px solid #E6C77A; color: #6A4A0C; font-weight: 600; cursor: pointer; }
  .alert.on { display: block; }
  .card ul { display: grid; gap: 3px; padding: 8px 0; border-block: 1px dashed var(--line); }
  .card li { display: flex; justify-content: space-between; gap: 12px; }
  .card footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .card footer label { display: flex; align-items: center; gap: 6px; }
  .empty { grid-column: 1 / -1; padding: 46px 20px; text-align: center; color: var(--soft); border: 1px dashed var(--line); border-radius: 12px; background: #fff; }

  #gate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: var(--bg); }
  #gate form { display: grid; gap: 12px; width: min(380px, 100%); padding: 28px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  #gate h2 { font-size: 1.3rem; }
  #gate label { display: grid; gap: 4px; font-size: .88rem; color: var(--soft); }
  #gate label.check { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  #gate-msg { min-height: 1.4em; color: var(--new); }
  #viewer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; background: rgba(30, 20, 10, .82); }
  #viewer div { display: grid; gap: 10px; justify-items: center; max-width: 94vw; padding: 14px; border-radius: 12px; background: #fff; }
  #viewer img { max-width: 100%; max-height: 76vh; object-fit: contain; }
  #toast { position: fixed; left: 50%; bottom: 22px; z-index: 50; transform: translate(-50%, 40px); opacity: 0; padding: 11px 20px; border-radius: 10px; background: var(--ink); color: #fff; transition: transform .3s, opacity .3s; pointer-events: none; }
  #toast.on { transform: translate(-50%, 0); opacity: 1; }
  #slip { display: none; }
  /* version 11 */
  .calls { display: grid; gap: 8px; margin-bottom: 12px; }
  .call { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 14px; border-radius: 12px; background: var(--new); color: #fff; font-weight: 600; font-size: 1.05rem; }
  .call small { font-weight: 400; opacity: .85; }
  .call button { margin-left: auto; background: #fff; color: var(--new); border-color: #fff; }
  .ptsbox { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #EAF3E6; border: 1px solid #9CC79A; }
  .ptsbox p { font-weight: 600; color: #1B5532; }
  .ptsbox div { display: flex; flex-wrap: wrap; gap: 8px; }
  .card.pts-ask { border-left-color: #2E8B57; }
  .sound-off { background: #FFD27A !important; color: var(--ink) !important; border-color: #FFD27A !important; }
  body.flash .bar { animation: flash 1s steps(2) 6; }
  @keyframes flash { 50% { background: var(--new); } }
  .so-group { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .so-group h2 { font-size: 1rem; margin-bottom: 8px; }
  .so-items { display: flex; flex-wrap: wrap; gap: 8px; }
  .so-items button.out { background: var(--new); border-color: var(--new); color: #fff; text-decoration: line-through; }
  .so-items button[disabled] { opacity: .45; cursor: default; }
  .lookup { display: grid; gap: 12px; max-width: 640px; }
  .lookup form { display: flex; flex-wrap: wrap; gap: 8px; }
  .lookup table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
  .lookup td, .lookup th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: .9rem; }
  .big { font-size: 1.6rem; font-weight: 700; }
  .dlv { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #EAF1FA; border: 1px solid #A9C3E6; }
  .dlv div { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dlv select { min-width: 180px; }
  .codbox { padding: 6px 10px; border-radius: 8px; background: #FFF3D6; border: 1px solid #E6C77A; font-weight: 600; color: #6A4A0C; }
  @media print {
    body { background: #fff; }
    .bar, .wrap, #gate, #viewer, #toast { display: none !important; }
    #slip { display: block; max-width: 80mm; margin: 0 auto; padding: 5mm; font: 11pt/1.4 ui-monospace, Menlo, Consolas, monospace; color: #000; }
    #slip hr { border: 0; border-top: 1px dashed #000; }
  }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="gate" hidden>
  <form id="gate-form">
    <h2>Pick Me Cafe counter</h2>
    <p style="color:var(--soft)">Orders, cake pre-orders and table bookings.</p>
    <label>Staff login ID (leave empty if you are the owner)<input id="lg-user" autocomplete="username" autocapitalize="none"></label>
    <label>Password<input type="password" id="lg-pass" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="lg-keep" checked> Keep me signed in on this device</label>
    <p id="gate-msg" role="alert"></p>
    <button class="main" type="submit">Log in</button>
    <a href="/">Back to the website</a>
  </form>
</div>

<header class="bar">
  <h1>Pick Me Cafe counter <small id="who"></small></h1>
  <div class="right">
    <button type="button" id="sound" class="sound-off" title="New orders and table calls make a sound">Turn sound on</button>
    <small id="sync">Connecting</small>
    <button type="button" id="refresh">Refresh now</button>
    <a class="btn" href="/" target="_blank" rel="noopener">Website</a>
    <a class="btn" href="/#admin" id="to-admin" hidden>Admin</a>
    <button type="button" id="logout">Log out</button>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <div class="tabs" role="tablist">
      <button type="button" data-tab="orders" class="on">Orders <span class="count" id="n-orders">0</span></button>
      <button type="button" data-tab="cakes">Cake pre-orders <span class="count" id="n-cakes">0</span></button>
      <button type="button" data-tab="tables">Table bookings <span class="count" id="n-tables">0</span></button>
      <button type="button" data-tab="soldout">Sold out</button>
      <button type="button" data-tab="points">Points</button>
    </div>
    <div class="filters">
      <input type="search" id="search" placeholder="Search number, name or phone" aria-label="Search">
      <select id="filter" aria-label="Show">
        <option value="active">Active only</option>
        <option value="pending">Pending only</option>
        <option value="check">Payment to check</option>
        <option value="points">Points to approve</option>
        <option value="unpaid">Not paid</option>
        <option value="all">Everything</option>
        <option value="closed">Finished or cancelled</option>
      </select>
    </div>
  </div>
  <div class="calls" id="calls" aria-live="assertive"></div>
  <p class="alert" id="to-check" role="status"></p>
  <p class="alert" id="to-points" role="status"></p>
  <p class="today" id="today"></p>
  <div class="grid" id="grid"></div>
</main>

<div id="viewer" hidden><div><img id="viewer-img" alt="Picture sent by the customer"><button type="button" id="viewer-close">Close</button></div></div>
<div id="toast" role="status"></div>
<div id="slip"></div>

<script src="/js/bs.js"></script>
<script>
  // "For" line: Nepali date and 12-hour time, like the rest of the website.
  function forWhen(o) {
    if (!o.schedule) return 'as soon as possible';
    const d = o.schedule.date;
    const bs = o.schedule.bs || (window.BS && /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? BS.label(d) : d);
    const [h, m] = String(o.schedule.time || '').split(':').map(Number);
    const time = Number.isFinite(h) ? `${h % 12 || 12}:${String(m || 0).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}` : esc(o.schedule.time || '');
    return `${esc(bs)} at ${time}`;
  }
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rs = (n) => 'Rs. ' + Number(n || 0).toLocaleString('en-IN');
  const when = (iso) => new Date(iso).toLocaleString('en-GB', { timeZone: 'Asia/Kathmandu', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true });
  const wa = (p) => String(p || '').replace(/\D/g, '').replace(/^(?=9\d{9}$)/, '977');
  const TYPE = { dinein: 'Dine-in', pickup: 'Pickup', delivery: 'Delivery' };
  const ORDER_STEPS = ['pending', 'acknowledged', 'preparing', 'ready', 'done', 'cancelled'];
  const TABLE_STEPS = ['pending', 'confirmed', 'seated', 'done', 'declined'];
  const CLOSED = ['done', 'cancelled', 'declined'];
  const NAMES = { pending: 'Pending', acknowledged: 'Acknowledged', preparing: 'Preparing', ready: 'Ready', done: 'Done', cancelled: 'Cancelled', confirmed: 'Confirmed', seated: 'Seated', declined: 'Declined' };
  const S = { tab: 'orders', orders: [], bookings: [], calls: [], menu: [], drivers: [], known: null, knownCalls: null, timer: null, cafe: 'Pick Me Cafe', sound: false, look: null };

  function toast(msg, ms) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove('on'), ms || 3500);
  }
  async function api(method, url, body) {
    const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401 && !/auth\/login/.test(url)) { gate('Please log in.'); throw new Error('login'); }
    if (!r.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }
  function gate(msg) {
    clearInterval(S.timer);
    $('gate').hidden = false;
    $('gate-msg').textContent = msg || '';
    $('lg-pass').focus();
  }

  const line = (label, v) => (v ? `<p><b>${label}:</b> ${esc(v)}</p>` : '');
  const contact = (x) => `${esc(x.name || 'Guest')}${x.phone ? ` · <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>` : ''}`;
  const steps = (list, cur) => list.map((s) => `<option value="${s}"${s === cur ? ' selected' : ''}>${NAMES[s]}</option>`).join('');
  const quick = (kind, x, step, label, main) => (x.status !== step && !CLOSED.includes(x.status) ? `<button type="button" class="${main ? 'main' : ''}" data-quick="${kind}" data-id="${esc(x.id)}" data-step="${step}">${label}</button>` : '');
  const picture = (file, label) => (file ? `<button type="button" data-pic="${esc(file)}">${label}</button>` : '');
  const waBtn = (x, text) => !x.phone ? '' : `<a class="btn" href="https://wa.me/${esc(wa(x.phone))}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">WhatsApp customer</a>`;

  // Paid online (eSewa / Fonepay QR) and not checked yet: staff call the guest, then confirm.
  const toCheck = (o) => o.lines && o.payment && o.payment.method !== 'later' && !o.paid && !CLOSED.includes(o.status);
  const PAY = { esewa: 'eSewa', fonepay: 'Fonepay' };
  function checkBox(o) {
    if (!toCheck(o)) return '';
    return `<div class="paycheck">
        <p>Payment to check: paid now by ${esc(PAY[o.payment.method] || o.payment.method)}, ${rs(o.total)}${o.payment.proof ? ', screenshot sent' : ', no screenshot'}${o.payment.txn ? `, code ${esc(o.payment.txn)}` : ''}. Call the guest to confirm.</p>
        <div>${o.phone ? `<a class="btn" href="tel:${esc(o.phone)}">Call ${esc(o.phone)}</a>` : ''}${picture(o.payment.proof, 'See screenshot')}
          <button type="button" class="main" data-confirm="${esc(o.id)}">Payment confirmed, send the order</button></div>
      </div>`;
  }
  // A guest asked to use points at checkout without a confirmed account: staff check and approve here.
  const askPts = (o) => o.points && o.points.asked && o.points.approved === null && !CLOSED.includes(o.status);
  function ptsBox(o) {
    if (askPts(o)) {
      return `<div class="ptsbox"><p>Wants to use ${o.points.asked} points (${rs(o.points.asked)} off) with phone ${esc(o.phone)}. Check it is their phone (call it or see it), then approve.</p>
        <div>${o.phone ? `<a class="btn" href="tel:${esc(o.phone)}">Call ${esc(o.phone)}</a>` : ''}<button type="button" class="main" data-pts="${esc(o.id)}" data-ok="1">Approve: take ${rs(o.points.asked)} off</button><button type="button" data-pts="${esc(o.id)}" data-ok="0">Don't use points</button></div></div>`;
    }
    const bits = [];
    if (o.points && o.points.used) bits.push(`${o.points.used} points used (${rs(o.points.value || o.points.used)} off)`);
    if (o.pointsEarned) bits.push(`${o.pointsEarned} points earned`);
    return bits.length ? `<p><b>Points:</b> ${esc(bits.join(' · '))}</p>` : '';
  }
  function orderCard(o) {
    return `<article class="card ${esc(o.status)}${toCheck(o) ? ' to-check' : ''}${askPts(o) ? ' pts-ask' : ''}">
      <header><strong>${esc(o.id)}</strong><span class="tag">${TYPE[o.type]}${o.tableNo ? ` · table ${esc(o.tableNo)}` : ''}</span><span class="step step--${esc(o.status)}">${NAMES[o.status] || esc(o.status)}</span><span class="step ${o.paid ? 'step--done' : ''}">${o.paid ? 'Paid' : 'Not paid'}</span><small>${when(o.createdAt)}</small><b>${rs(o.total)}</b></header>
      ${checkBox(o)}${ptsBox(o)}
      <p>${contact(o)}</p>
      <p><b>For:</b> ${forWhen(o)}</p>
      ${line('Address', o.address)}
      ${o.type === 'delivery' ? deliveryBox(o) : ''}
      <ul>${o.lines.map((l) => `<li><span>${l.qty} × ${esc(l.name)}${l.label ? ` (${esc(l.label)})` : ''}${l.extras && l.extras.length ? ` <em>+ ${esc(l.extras.join(', '))}</em>` : ''}</span><span>${rs(l.qty * l.price)}</span></li>`).join('')}${o.deliveryFee ? `<li><span>Delivery</span><span>${rs(o.deliveryFee)}</span></li>` : ''}</ul>
      ${line('On the cake', o.cakeMessage)}${line('Occasion', o.occasion)}${line('Notes', o.notes)}
      <p><b>Payment:</b> ${o.payment.method === 'later' ? 'pay later' : o.payment.method === 'cod' ? '<span class="codbox">Cash on delivery' + (o.payment.change ? `, bring change for Rs. ${o.payment.change}` : '') + '</span>' : esc(o.payment.method)}${o.payment.txn ? `, code ${esc(o.payment.txn)}` : ''}${o.paid ? ' · checked' : ''}</p>
      <footer>
        ${quick('orders', o, 'acknowledged', 'Acknowledge', o.status === 'pending')}${quick('orders', o, 'done', 'Mark done')}
        ${o.paid ? '' : `<button type="button" class="main" data-paid="${esc(o.id)}">Mark paid</button>`}
        <select data-patch="orders" data-id="${esc(o.id)}" data-key="status" aria-label="Status">${steps(ORDER_STEPS, o.status)}</select>
        ${o.paid ? `<button type="button" data-unpaid="${esc(o.id)}">Mark not paid</button>` : ''}
      </footer>
      <footer>
        ${picture(o.payment.proof, 'Payment screenshot')}${picture(o.refPhoto, 'Cake design photo')}
        <button type="button" data-print="${esc(o.id)}">Print slip</button>
        ${waBtn(o, `Hello ${o.name || ''}, your ${S.cafe} order ${o.id} is now ${o.status.toUpperCase()}.`)}
      </footer></article>`;
  }
  // Delivery: the pin on the map, and which driver takes it (version 12).
  const DSTEP = { assigned: 'given to the driver', picked: 'picked up', onway: 'on the way', delivered: 'delivered' };
  function deliveryBox(o) {
    const d = o.delivery || {};
    const pin = o.location ? `<a class="btn" href="https://www.google.com/maps?q=${o.location.lat},${o.location.lng}" target="_blank" rel="noopener">Pin on the map</a>` : '<span>No map pin (address only)</span>';
    const done = CLOSED.includes(o.status);
    const opts = S.drivers.map((x) => `<option value="${esc(x.id)}"${o.driver && o.driver.id === x.id ? ' selected' : ''}>${esc(x.name)}${x.online ? ' (online)' : ''}${x.busy ? ` · ${x.busy} on hand` : ''}</option>`).join('');
    return `<div class="dlv"><div>${pin}${o.driver ? `<span>Driver: <b>${esc(o.driver.name)}</b>${d.status ? ` · ${DSTEP[d.status] || d.status}` : ''}</span>` : ''}</div>
      ${done ? '' : S.drivers.length ? `<div><label>Driver <select data-driver="${esc(o.id)}"><option value="">Choose a driver</option>${opts}</select></label></div>` : '<div><span>Add a driver login in Admin &gt; Security (role: Delivery driver).</span></div>'}</div>`;
  }
  function tableCard(b) {
    return `<article class="card ${esc(b.status)}">
      <header><strong>${esc(b.id)}</strong><span class="tag">${esc(b.people)} people</span><span class="step step--${esc(b.status)}">${NAMES[b.status] || esc(b.status)}</span><small>asked ${when(b.createdAt)}</small></header>
      <p><b>${esc(b.bs || b.date)} at ${esc(b.time)}</b>${b.seating ? ` · ${esc(b.seating)}` : ''}</p>
      <p>${contact(b)}</p>
      ${line('Food ready on arrival', b.food)}${line('Name on cake', b.cakeName)}${line('Decoration', b.decoration)}${line('Remarks', b.remarks)}
      <footer>
        ${quick('bookings', b, 'confirmed', 'Confirm', true)}
        <select data-patch="bookings" data-id="${esc(b.id)}" data-key="status" aria-label="Status">${steps(TABLE_STEPS, b.status)}</select>
        ${waBtn(b, `Hello ${b.name || ''}, your table at ${S.cafe} for ${b.bs || b.date} at ${b.time} (${b.people} people) is ${b.status.toUpperCase()}.`)}
      </footer></article>`;
  }

  const lists = () => ({ orders: S.orders.filter((o) => !o.hasWhole), cakes: S.orders.filter((o) => o.hasWhole), tables: S.bookings });
  function draw() {
    const all = lists();
    let open = 0;
    for (const k of Object.keys(all)) {
      const n = all[k].filter((x) => !CLOSED.includes(x.status)).length;
      $('n-' + k).textContent = n;
      open += n;
    }
    document.title = (open ? `(${open}) ` : '') + 'Counter | Pick Me Cafe';
    const todayAD = new Date(Date.now() + 345 * 60e3).toISOString().slice(0, 10);
    const day = (iso) => new Date(Date.parse(iso) + 345 * 60e3).toISOString().slice(0, 10);
    const t = S.orders.filter((o) => day(o.createdAt) === todayAD && o.status !== 'cancelled');
    const sum = (arr) => arr.reduce((n, o) => n + Number(o.total || 0), 0);
    $('today').innerHTML = `<span>Placed today: <b>${t.length}</b> order${t.length === 1 ? '' : 's'}</span><span>Total <b>${rs(sum(t))}</b></span><span>Paid <b>${rs(sum(t.filter((o) => o.paid)))}</b></span><span>Not paid <b>${rs(sum(t.filter((o) => !o.paid)))}</b></span><span>Still to do <b>${t.filter((o) => o.status !== 'done').length}</b></span>`;
    const checks = S.orders.filter(toCheck);
    $('to-check').classList.toggle('on', checks.length > 0);
    $('to-check').textContent = checks.length ? `${checks.length} online payment${checks.length === 1 ? '' : 's'} to check: ${checks.map((o) => o.id).join(', ')}. Tap to see.` : '';
    const asks = S.orders.filter(askPts);
    $('to-points').classList.toggle('on', asks.length > 0);
    $('to-points').textContent = asks.length ? `${asks.length} guest${asks.length === 1 ? ' wants' : 's want'} to use points: ${asks.map((o) => o.id).join(', ')}. Tap to see.` : '';
    drawCalls();
    $('search').parentElement.hidden = S.tab === 'soldout' || S.tab === 'points';
    if (S.tab === 'soldout') return drawSoldOut();
    if (S.tab === 'points') { if (document.activeElement && document.activeElement.id === 'pts-phone') return; return drawPoints(); }
    const q = $('search').value.trim().toLowerCase();
    const f = $('filter').value;
    const rows = all[S.tab].filter((x) => {
      const closed = CLOSED.includes(x.status);
      if (f === 'check' && !toCheck(x)) return false;
      if (f === 'points' && !askPts(x)) return false;
      if ((f === 'active' && closed) || (f === 'closed' && !closed) || (f === 'pending' && x.status !== 'pending') || (f === 'unpaid' && (x.paid || !x.lines || x.status === 'cancelled'))) return false;
      return !q || [x.id, x.name, x.phone, x.address, x.cakeMessage, x.bs].some((v) => String(v || '').toLowerCase().includes(q));
    });
    const busy = $('grid').contains(document.activeElement) && document.activeElement.tagName === 'SELECT';
    if (busy) return;
    $('grid').innerHTML = rows.length ? rows.map(S.tab === 'tables' ? tableCard : orderCard).join('') : '<p class="empty">Nothing here right now. New orders and bookings appear on their own.</p>';
  }
  async function load(quiet) {
    try {
      const [o, b, calls, drivers] = await Promise.all([api('GET', '/api/desk/orders'), api('GET', '/api/desk/bookings'), api('GET', '/api/desk/calls').catch(() => []), api('GET', '/api/desk/drivers').catch(() => [])]);
      S.orders = o; S.bookings = b; S.calls = calls; S.drivers = drivers;
      const ids = new Set([...o, ...b].map((x) => x.id));
      const callIds = new Set(calls.map((c) => c.id));
      if (S.known) {
        const fresh = [...o, ...b].filter((x) => !S.known.has(x.id));
        const freshCalls = calls.filter((c) => !S.knownCalls.has(c.id));
        if (fresh.length) toast(`New: ${fresh.map((x) => x.id).join(', ')}`, 8000);
        if (freshCalls.length) toast(freshCalls.map((c) => `Table ${c.table}: ${c.label}`).join(' · '), 9000);
        if (fresh.length || freshCalls.length) alertNew(fresh.length ? `New order ${fresh[0].id}` : `Table ${freshCalls[0].table}: ${freshCalls[0].label}`);
      }
      // A soft reminder every 30 seconds while an order waits over a minute to be acknowledged, or a table call is open.
      const waiting = o.some((x) => x.status === 'pending' && Date.now() - Date.parse(x.createdAt) > 60e3) || calls.some((c) => Date.now() - Date.parse(c.at) > 45e3);
      if (waiting && Date.now() - (S.nag || 0) > 30e3) { S.nag = Date.now(); ring(true); }
      S.known = ids;
      S.knownCalls = callIds;
      $('sync').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      draw();
    } catch (e) { if (!quiet && e.message !== 'login') toast(e.message); }
  }
  async function start() {
    const me = await fetch('/api/auth/me').then((r) => r.json()).catch(() => ({}));
    if (!me.role) return gate('');
    $('gate').hidden = true;
    S.cafe = me.cafe || S.cafe;
    $('who').textContent = '· ' + me.name;
    $('to-admin').hidden = me.role !== 'admin';
    paintSound();
    load(false);
    clearInterval(S.timer);
    // Keeps checking even when the tab is in the background, so the sound still plays.
    S.timer = setInterval(() => load(true), 8000);
  }

  /* sound and flashing for new orders and table calls (browsers need one tap first: "Turn sound on") */
  let audio = null;
  function ring(soft) {
    if (!S.sound || !audio) return;
    const t = audio.currentTime;
    const notes = soft ? [880] : [880, 1175, 1568];
    notes.forEach((f, i) => {
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.18);
      g.gain.exponentialRampToValueAtTime(soft ? 0.15 : 0.35, t + i * 0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.4);
      o.connect(g).connect(audio.destination);
      o.start(t + i * 0.18); o.stop(t + i * 0.18 + 0.45);
    });
  }
  function alertNew(text) {
    ring(false);
    setTimeout(() => ring(false), 1500);
    document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash');
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(text, { body: S.cafe + ' counter', icon: '/img/logo.png', tag: 'pm-counter' }); } catch (e) { /* not allowed here */ }
    }
  }
  $('sound').addEventListener('click', () => {
    S.sound = !S.sound;
    try { localStorage.setItem('pm_counter_sound', S.sound ? '1' : '0'); } catch (e) { /* no storage */ }
    if (S.sound) {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      audio.resume();
      ring(false);
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
    }
    paintSound();
  });
  function paintSound() { $('sound').textContent = S.sound ? 'Sound on' : 'Turn sound on'; $('sound').classList.toggle('sound-off', !S.sound); }
  // The browser only allows sound after a tap: the first tap anywhere turns it back on if it was on before.
  document.addEventListener('pointerdown', () => {
    let want = false;
    try { want = localStorage.getItem('pm_counter_sound') === '1'; } catch (e) { /* no storage */ }
    if (want && !S.sound) { S.sound = true; audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); paintSound(); }
  }, { once: true });

  const ago = (iso) => { const m = Math.round((Date.now() - Date.parse(iso)) / 60e3); return m < 1 ? 'just now' : `${m} min ago`; };
  function drawCalls() {
    $('calls').innerHTML = S.calls.map((c) => `<div class="call">Table ${esc(c.table)}: ${esc(c.label)} <small>${ago(c.at)}</small><button type="button" data-calldone="${esc(c.id)}">Done</button></div>`).join('');
  }
  async function loadMenu() { S.menu = await api('GET', '/api/desk/menu'); }
  function drawSoldOut() {
    const out = S.menu.flatMap((g) => g.items.filter((i) => i.out));
    $('grid').innerHTML = `<p class="empty" style="grid-column:1/-1;padding:14px">Tap an item when it runs out. It is hidden on the website and app for today and comes back by itself tomorrow morning. ${out.length ? `Sold out now: <b>${out.map((i) => esc(i.name)).join(', ')}</b>` : 'Nothing is sold out.'}</p>`
      + S.menu.map((g) => `<section class="so-group"><h2>${esc(g.name)}</h2><div class="so-items">${g.items.map((i) => `<button type="button" class="${i.out ? 'out' : ''}" data-soldout="${esc(i.id)}" data-out="${i.out ? '0' : '1'}"${i.off ? ' disabled title="Switched off in admin"' : ''}>${esc(i.name)}</button>`).join('')}</div></section>`).join('');
  }
  function drawPoints() {
    const L = S.look;
    $('grid').innerHTML = `<div class="lookup" style="grid-column:1/-1">
      <form id="pts-form"><input type="tel" id="pts-phone" placeholder="Guest's phone number" inputmode="tel" value="${esc(L ? L.phone : '')}" required><button class="main" type="submit">Show points</button></form>
      ${L ? `<p><span class="big">${L.balance}</span> points = ${rs(L.balance)} off${L.next && L.balance ? ` · ${L.next.amount} run out on ${new Date(L.next.exp).toLocaleDateString('en-GB')}` : ''}</p>
        ${L.account ? `<p>Account: <b>${esc(L.account.name || 'no name')}</b> · phone ${L.account.phoneVerified ? 'confirmed' : `<b>not confirmed</b> <button type="button" class="main" data-confirmphone="${esc(L.account.id)}">This is their phone: confirm it</button>`}</p>` : '<p>No account (points by phone number only).</p>'}
        <table><thead><tr><th>When</th><th>What</th><th>Points</th><th>By</th></tr></thead><tbody>${L.lines.map((l) => `<tr><td>${when(l.at)}</td><td>${esc({ earn: 'Earned', spend: 'Used', refund: 'Given back', reverse: 'Taken back', adjust: 'Changed by owner', birthday: 'Birthday', closed: 'Account closed' }[l.kind] || l.kind)}${l.order ? ` · ${esc(l.order)}` : ''}${l.note ? ` · ${esc(l.note)}` : ''}</td><td>${l.amount > 0 ? '+' : ''}${l.amount}</td><td>${esc(l.by || '')}</td></tr>`).join('') || '<tr><td colspan="4">Nothing yet.</td></tr>'}</tbody></table>` : '<p>Type a phone number to see its points. Points are added by themselves when an order is marked done.</p>'}
    </div>`;
  }
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'pts-form') return;
    e.preventDefault();
    try { S.look = await api('GET', '/api/desk/points/' + encodeURIComponent($('pts-phone').value.trim())); $('pts-phone').blur(); draw(); } catch (err) { if (err.message !== 'login') toast(err.message); }
  });

  function printSlip(id) {
    const o = S.orders.find((x) => x.id === id);
    if (!o) return;
    $('slip').innerHTML = `<p style="text-align:center"><b>${esc(S.cafe.toUpperCase())}</b><br>${esc(o.id)} · ${TYPE[o.type].toUpperCase()}<br>${when(o.createdAt)}</p><hr>
      <p>${esc(o.name || 'Guest')}${o.phone ? `, ${esc(o.phone)}` : ''}${o.address ? `<br>Address: ${esc(o.address)}` : ''}${o.tableNo ? `<br>Table: ${esc(o.tableNo)}` : ''}
      <br>For: ${forWhen(o)}</p><hr>
      ${o.lines.map((l) => `<p>${l.qty} x ${esc(l.name)}${l.label ? ` (${esc(l.label)})` : ''}${l.extras && l.extras.length ? ` + ${esc(l.extras.join(', '))}` : ''} = ${rs(l.qty * l.price)}</p>`).join('')}
      ${o.deliveryFee ? `<p>Delivery = ${rs(o.deliveryFee)}</p>` : ''}<hr>
      <p><b>TOTAL ${rs(o.total)}</b> · ${o.payment.method === 'later' ? 'pay later' : o.payment.method === 'cod' ? 'CASH ON DELIVERY' : o.payment.method}${o.payment.change ? ` · change for Rs. ${o.payment.change}` : ''}${o.paid ? ', payment checked' : ''}</p>
      ${o.driver ? `<p>Driver: ${esc(o.driver.name)}</p>` : ''}
      ${o.cakeMessage ? `<p>On the cake: <b>${esc(o.cakeMessage)}</b></p>` : ''}${o.occasion ? `<p>Occasion: ${esc(o.occasion)}</p>` : ''}${o.notes ? `<p>Notes: ${esc(o.notes)}</p>` : ''}`;
    window.print();
  }

  $('gate-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await api('POST', '/api/auth/login', { username: $('lg-user').value.trim(), password: $('lg-pass').value, remember: $('lg-keep').checked });
      $('lg-pass').value = '';
      start();
    } catch (err) { $('gate-msg').textContent = err.message; }
  });
  $('logout').addEventListener('click', async () => { await api('POST', '/api/auth/logout').catch(() => {}); S.known = null; gate(''); });
  $('refresh').addEventListener('click', () => load(false));
  $('search').addEventListener('input', draw);
  $('filter').addEventListener('change', draw);
  $('viewer-close').addEventListener('click', () => { $('viewer').hidden = true; });
  $('viewer').addEventListener('click', (e) => { if (e.target.id === 'viewer') $('viewer').hidden = true; });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.known) load(true); });
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('[data-tab]');
    if (tab) {
      S.tab = tab.dataset.tab;
      if (S.tab === 'soldout') loadMenu().then(draw).catch((err) => toast(err.message));
      document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b === tab));
      return draw();
    }
    const cd = e.target.closest('[data-calldone]');
    if (cd) { api('POST', `/api/desk/calls/${cd.dataset.calldone}/done`).then(() => load(true)).catch((err) => toast(err.message)); return; }
    const so = e.target.closest('[data-soldout]');
    if (so) { api('POST', '/api/desk/soldout', { itemId: so.dataset.soldout, out: so.dataset.out === '1' }).then(async () => { await loadMenu(); draw(); toast(so.dataset.out === '1' ? 'Marked sold out for today.' : 'Back on the menu.'); }).catch((err) => toast(err.message)); return; }
    const pts = e.target.closest('[data-pts]');
    if (pts) { api('POST', `/api/desk/orders/${pts.dataset.pts}/points`, { approve: pts.dataset.ok === '1' }).then(() => { toast(pts.dataset.ok === '1' ? 'Points taken off. The total is updated.' : 'Points not used.'); load(true); }).catch((err) => toast(err.message)); return; }
    const cp = e.target.closest('[data-confirmphone]');
    if (cp) { api('POST', `/api/desk/customers/${cp.dataset.confirmphone}/confirm-phone`).then(async () => { S.look = await api('GET', '/api/desk/points/' + S.look.phone); draw(); toast('Phone confirmed. They can use points from checkout now.'); }).catch((err) => toast(err.message)); return; }
    if (e.target.closest('#to-points')) { $('filter').value = 'points'; S.tab = 'orders'; document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === 'orders')); return draw(); }
    const pic = e.target.closest('[data-pic]');
    if (pic) { $('viewer-img').src = '/api/desk/proof/' + pic.dataset.pic; $('viewer').hidden = false; }
    const print = e.target.closest('[data-print]');
    if (print) printSlip(print.dataset.print);
    if (e.target.closest('#to-check')) { $('filter').value = 'check'; const first = S.orders.find(toCheck); S.tab = first && first.hasWhole ? 'cakes' : 'orders'; document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab)); return draw(); }
    const confirm = e.target.closest('[data-confirm]');
    if (confirm) {
      const o = S.orders.find((x) => x.id === confirm.dataset.confirm);
      const body = { paid: true };
      if (o && o.status === 'pending') body.status = 'acknowledged';
      api('PATCH', `/api/desk/orders/${confirm.dataset.confirm}`, body).then(() => { toast('Payment confirmed. The order is on its way to the kitchen.'); load(true); }).catch((err) => { if (err.message !== 'login') toast(err.message); });
      return;
    }
    const q = e.target.closest('[data-quick]');
    const paid = e.target.closest('[data-paid]');
    const unpaid = e.target.closest('[data-unpaid]');
    if (q || paid || unpaid) {
      const req = q ? api('PATCH', `/api/desk/${q.dataset.quick}/${q.dataset.id}`, { status: q.dataset.step })
        : api('PATCH', `/api/desk/orders/${(paid || unpaid).dataset[paid ? 'paid' : 'unpaid']}`, { paid: Boolean(paid) });
      req.then(() => { toast('Updated.'); load(true); }).catch((err) => { if (err.message !== 'login') toast(err.message); });
    }
  });
  document.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.dataset.driver) {
      try { await api('POST', `/api/desk/orders/${t.dataset.driver}/driver`, { driverId: t.value }); toast(t.value ? 'Given to the driver. His phone rings.' : 'Taken back from the driver.'); t.blur(); load(true); } catch (err) { if (err.message !== 'login') toast(err.message); }
      return;
    }
    if (!t.dataset.patch) return;
    try {
      await api('PATCH', `/api/desk/${t.dataset.patch}/${t.dataset.id}`, { [t.dataset.key]: t.type === 'checkbox' ? t.checked : t.value });
      toast('Updated.');
      t.blur();
      load(true);
    } catch (err) { if (err.message !== 'login') toast(err.message); }
  });
  start();
})();
</script>
</body>
</html>
